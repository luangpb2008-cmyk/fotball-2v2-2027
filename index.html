<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fotball 2v2 2027 — v134</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif}body{touch-action:none}#game{position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;pointer-events:none}.score{padding:8px 18px;border:1px solid #fff3;border-radius:18px;background:#071018cc;font-weight:800;font-size:18px;white-space:nowrap}#status{position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:5;padding:6px 12px;border-radius:12px;background:#07101899;font-size:12px;opacity:.75;pointer-events:none}.hidden{display:none!important}#controls{position:absolute;inset:0;z-index:10;pointer-events:none}#joystick{position:absolute;left:clamp(18px,5vw,70px);bottom:clamp(18px,6vh,60px);width:128px;height:128px;border-radius:50%;background:#ffffff14;border:2px solid #cbd5e144;box-shadow:inset 0 0 0 10px #ffffff06;pointer-events:auto}#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#d7dde355;border:2px solid #e5e7eb88;box-shadow:0 4px 14px #0008;pointer-events:none}.btns{position:absolute;right:clamp(18px,4vw,55px);bottom:clamp(20px,5vh,50px);display:flex;align-items:end;gap:12px}.btn{pointer-events:auto;border:1px solid #fff4;border-radius:50%;background:#ffffff14;color:#fff;width:64px;height:64px;font-weight:800;font-size:12px}.btn:active{background:#ffffff2a;transform:scale(.96)}#shoot{width:76px;height:76px}#swap{position:absolute;right:clamp(22px,4vw,60px);bottom:clamp(105px,18vh,150px);width:56px;height:56px}#fullscreen{position:absolute;right:16px;top:16px;width:42px;height:42px;border-radius:12px;border:1px solid #fff3;background:#07101899;color:#fff;z-index:12}.panel{width:min(560px,94vw);padding:28px;border:1px solid #fff2;border-radius:24px;background:#071018ee;box-shadow:0 20px 60px #000b;text-align:center}.panel h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}.panel p{opacity:.72;margin:8px 0 20px}#menu{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#163044cc,#03080ddd 75%);padding:20px}.panel button{padding:14px 26px;border:0;border-radius:14px;background:#22c55e;color:#041008;font-size:17px;font-weight:900}.small{font-size:12px;opacity:.55;margin-top:15px}
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas><div id="hud"><div class="score">AZUL <span id="sA">0</span> — <span id="sB">0</span> VERMELHO</div></div><div id="status">v134 • 2v2 multiplayer</div><div id="controls"><div id="joystick"><div id="stick"></div></div><button id="swap" class="btn">TROCAR</button><div class="btns"><button id="pass" class="btn">PASSE</button><button id="shoot" class="btn">CHUTE</button></div><button id="fullscreen">⛶</button></div><div id="menu"><div class="panel"><h1>Fotball 2v2 2027</h1><p id="menuText">Multiplayer local • 1 atacante + 1 goleiro por equipe</p><button id="start">JOGAR</button><div class="small">v134 • primeiro a 5 gols</div></div></div></div>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),sA=document.getElementById('sA'),sB=document.getElementById('sB'),menu=document.getElementById('menu'),menuText=document.getElementById('menuText'),start=document.getElementById('start'),joy=document.getElementById('joystick'),stick=document.getElementById('stick');let W=innerWidth,H=innerHeight,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const F={x:0,y:0,w:0,h:0,goal:0};function field(){F.w=Math.min(W*.82,H*1.7);F.h=F.w*.58;F.x=(W-F.w)/2;F.y=(H-F.h)/2;F.goal=Math.max(70,F.h*.26)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function norm(a,b){let l=Math.hypot(a,b)||1;return{x:a/l,y:b/l}}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function lerp(a,b,t){return a+(b-a)*t}
const G={run:false,a:0,b:0,control:0,last:performance.now(),pause:0};const P=[{team:0,role:'att',x:0,y:0,r:22,speed:285,color:'#38bdf8'},{team:0,role:'gk',x:0,y:0,r:21,speed:250,color:'#60a5fa'},{team:1,role:'att',x:0,y:0,r:22,speed:285,color:'#fb7185'},{team:1,role:'gk',x:0,y:0,r:21,speed:250,color:'#f43f5e'}];const B={x:0,y:0,r:10,vx:0,vy:0,owner:-1,kick:.2};const I={x:0,y:0};
function score(){sA.textContent=G.a;sB.textContent=G.b}function reset(){field();P[0].x=F.x+F.w*.27;P[0].y=F.y+F.h*.5;P[1].x=F.x+F.w*.08;P[1].y=F.y+F.h*.5;P[2].x=F.x+F.w*.73;P[2].y=F.y+F.h*.5;P[3].x=F.x+F.w*.92;P[3].y=F.y+F.h*.5;B.x=F.x+F.w*.5;B.y=F.y+F.h*.5;B.vx=B.vy=0;B.owner=0;B.kick=.2}
function goal(team){if(team===0)G.a++;else G.b++;score();B.owner=-1;B.vx=B.vy=0;G.pause=1.15;if(G.a>=5||G.b>=5){G.run=false;setTimeout(()=>{menu.classList.remove('hidden');menuText.textContent=(G.a>=5?'AZUL':'VERMELHO')+' venceu!';start.textContent='JOGAR NOVAMENTE'},1150)}else setTimeout(reset,1150)}
function move(p,dx,dy,dt){let n=norm(dx,dy),m=Math.min(1,Math.hypot(dx,dy));p.x+=n.x*p.speed*m*dt;p.y+=n.y*p.speed*m*dt;p.x=clamp(p.x,F.x+22,F.x+F.w-22);p.y=clamp(p.y,F.y+22,F.y+F.h-22);let gy=F.y+F.h/2-F.goal/2,gy2=gy+F.goal;if(p.y>gy&&p.y<gy2&&p.x<F.x+48)p.x=F.x+48;if(p.y>gy&&p.y<gy2&&p.x>F.x+F.w-48)p.x=F.x+F.w-48}
function carry(){if(B.owner<0)return;let p=P[B.owner],n=norm(I.x,I.y);B.x=p.x+n.x*(p.r+B.r+4);B.y=p.y+n.y*(p.r+B.r+4);B.vx=B.vy=0}
function teammate(i){let q=i<2?1:0;return i<2?q:i===2?3:2}
function kick(power,dir){let i=G.control,p=P[i];if(B.owner!==i)return;let n=norm(dir.x,dir.y);B.owner=-1;B.kick=.13;B.vx=n.x*power;B.vy=n.y*power}
function pass(){let i=G.control,j=teammate(i);if(B.owner!==i)return;let q=P[j];kick(440,{x:q.x-P[i].x,y:q.y-P[i].y})}
function collide(i,j){let a=P[i],b=P[j],z=d(a,b),min=a.r+b.r;if(z<min){let n=norm(a.x-b.x,a.y-b.y),p=(min-z)/2;a.x+=n.x*p;a.y+=n.y*p;b.x-=n.x*p;b.y-=n.y*p;if(P[i].team!==P[j].team&&B.owner===j&&z<min+8)B.owner=i}}
function ai(dt){for(let i=0;i<4;i++){if(i===G.control)continue;let p=P[i],tx,ty;if(p.role==='gk'){tx=p.team===0?F.x+F.w*.1:F.x+F.w*.9;ty=clamp(B.y,F.y+F.h*.28,F.y+F.h*.72)}else{tx=B.x;ty=B.y;if(B.owner>=0&&P[B.owner].team===p.team){let j=teammate(i);tx=lerp(B.x,P[j].x,.3);ty=lerp(B.y,P[j].y,.3)}}move(p,tx-p.x,ty-p.y,dt)}}
function ball(dt){if(B.owner>=0){carry();return}B.x+=B.vx*dt;B.y+=B.vy*dt;B.vx*=Math.pow(.985,dt*60);B.vy*=Math.pow(.985,dt*60);let top=F.y+10,bot=F.y+F.h-10;if(B.y<top){B.y=top;B.vy=Math.abs(B.vy)*.72}if(B.y>bot){B.y=bot;B.vy=-Math.abs(B.vy)*.72}let gy=F.y+F.h/2-F.goal/2,gy2=gy+F.goal;if(B.x<F.x-8&&B.y>gy&&B.y<gy2){goal(1);return}if(B.x>F.x+F.w+8&&B.y>gy&&B.y<gy2){goal(0);return}if(B.x<F.x+10&&!(B.y>gy&&B.y<gy2)){B.x=F.x+10;B.vx=Math.abs(B.vx)*.72}if(B.x>F.x+F.w-10&&!(B.y>gy&&B.y<gy2)){B.x=F.x+F.w-10;B.vx=-Math.abs(B.vx)*.72}if(B.kick>0){B.kick-=dt;return}for(let i=0;i<4;i++){let p=P[i],z=d(p,B);if(z<p.r+B.r+4){if(p.role==='gk'){let n=norm(B.x-p.x,B.y-p.y);B.x=p.x+n.x*(p.r+B.r+2);B.y=p.y+n.y*(p.r+B.r+2);B.vx=n.x*360;B.vy=n.y*360;B.kick=.08}else{B.owner=i;B.kick=.12}break}}}
function stands(){let gy=F.y+F.h/2-F.goal/2;for(let side of [0,1]){let sx=side?F.x+F.w+16:F.x-84;x.fillStyle='#18232d';x.fillRect(sx,F.y-8,68,F.h+16);for(let r=0;r<7;r++)for(let k=0;k<16;k++){x.fillStyle=['#ef4444','#3b82f6','#f8fafc','#f59e0b'][(r+k)%4];x.beginPath();x.arc(sx+7+k*3.7,F.y+16+r*(F.h-32)/6,2.4,0,7);x.fill()}x.fillStyle='#ffffff12';x.fillRect(sx-2,gy-8,72,F.goal+16)}}
function draw(){field();x.fillStyle='#071018';x.fillRect(0,0,W,H);stands();x.fillStyle='#08783b';x.fillRect(F.x,F.y,F.w,F.h);x.strokeStyle='#ffffffcc';x.lineWidth=3;x.strokeRect(F.x,F.y,F.w,F.h);x.beginPath();x.moveTo(F.x+F.w/2,F.y);x.lineTo(F.x+F.w/2,F.y+F.h);x.stroke();x.beginPath();x.arc(F.x+F.w/2,F.y+F.h/2,F.h*.15,0,7);x.stroke();let bw=F.w*.13,bh=F.h*.48;x.strokeRect(F.x,F.y+(F.h-bh)/2,bw,bh);x.strokeRect(F.x+F.w-bw,F.y+(F.h-bh)/2,bw,bh);let gy=F.y+F.h/2-F.goal/2;x.fillStyle='#d8dee7';x.fillRect(F.x-12,gy,12,F.goal);x.fillRect(F.x+F.w,gy,12,F.goal);x.strokeStyle='#fff';x.lineWidth=4;x.beginPath();x.moveTo(F.x,gy-3);x.lineTo(F.x,gy+F.goal+3);x.stroke();x.beginPath();x.moveTo(F.x+F.w,gy-3);x.lineTo(F.x+F.w,gy+F.goal+3);x.stroke();for(let i=0;i<4;i++){let p=P[i];x.fillStyle='#0006';x.beginPath();x.ellipse(p.x,p.y+p.r*.8,p.r*.95,p.r*.35,0,0,7);x.fill();x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.strokeStyle=i===G.control?'#fff':'#0005';x.lineWidth=i===G.control?3:1;x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(p.x-p.r*.32,p.y-p.r*.25,p.r*.16,0,7);x.fill();x.beginPath();x.arc(p.x+p.r*.32,p.y-p.r*.25,p.r*.16,0,7);x.fill();x.fillStyle='#071018';x.font='bold 9px Arial';x.textAlign='center';x.fillText(p.role==='gk'?'GK':'AT',p.x,p.y+4)}x.fillStyle='#fff';x.beginPath();x.arc(B.x,B.y,B.r,0,7);x.fill();x.strokeStyle='#111827';x.lineWidth=2;x.stroke();if(G.pause>0){x.fillStyle='#fff';x.font='900 34px Arial';x.textAlign='center';x.fillText('GOL!',W/2,100)}}
function loop(t){let dt=Math.min(.033,(t-G.last)/1000);G.last=t;if(G.run&&G.pause<=0){move(P[G.control],I.x,I.y,dt);ai(dt);for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)collide(i,j);ball(dt)}else if(G.pause>0)G.pause-=dt;draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function stickMove(cx,cy){let r=joy.getBoundingClientRect(),dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2),m=r.width*.38,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}I.x=dx/m;I.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}function stickClear(){I.x=I.y=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);stickMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(e.buttons)stickMove(e.clientX,e.clientY)});joy.addEventListener('pointerup',stickClear);joy.addEventListener('pointercancel',stickClear);
document.getElementById('pass').addEventListener('pointerdown',e=>{e.preventDefault();pass()});let sd=0;document.getElementById('shoot').addEventListener('pointerdown',e=>{e.preventDefault();sd=performance.now()});document.getElementById('shoot').addEventListener('pointerup',e=>{e.preventDefault();let q=Math.min(1,(performance.now()-sd)/1200),dx=I.x,dy=I.y;if(Math.hypot(dx,dy)<.15){dx=G.control<2?1:-1;dy=0}kick(360+q*620,{x:dx,y:dy})});document.getElementById('swap').addEventListener('pointerdown',()=>G.control=G.control===0?1:0);document.getElementById('fullscreen').addEventListener('click',async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}});start.addEventListener('click',()=>{menu.classList.add('hidden');G.a=G.b=0;G.control=0;G.run=true;score();reset()});
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='arrowup')I.y=-1;if(k==='s'||k==='arrowdown')I.y=1;if(k==='a'||k==='arrowleft')I.x=-1;if(k==='d'||k==='arrowright')I.x=1;if(k==='e')pass();if(k==='q')G.control=G.control===0?1:0;if(k===' ')kick(620,{x:I.x||1,y:I.y})});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='w'||k==='s'||k==='arrowup'||k==='arrowdown')I.y=0;if(k==='a'||k==='d'||k==='arrowleft'||k==='arrowright')I.x=0});
})();
</script></body></html>
